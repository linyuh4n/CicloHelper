services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ciclohelper-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "CicloHelper@2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "CicloHelper@2026!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ciclohelper-network

  api:
    image: ciclohelper-api:latest
    container_name: ciclohelper-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CicloHelper;User Id=sa;Password=CicloHelper@2026!;TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8080/health/live || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ciclohelper-network

  web:
    image: ciclohelper-web:latest
    container_name: ciclohelper-web
    ports:
      - "8081:8080"
    depends_on:
      - api
    networks:
      - ciclohelper-network

volumes:
  sqlserver_data:

networks:
  ciclohelper-network:
    driver: bridge