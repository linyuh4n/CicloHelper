version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ciclohelper-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'CicloHelper@2026!'
      MSSQL_PID: 'Developer'
    ports:
      - '1433:1433'
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CicloHelper@2026!' -Q 'SELECT 1' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ciclohelper-network

volumes:
  sqlserver_data:

networks:
  ciclohelper-network:
    driver: bridge
